services:
  postgres:
    image: postgres:17-alpine
    container_name: reelindo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reelindo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reelindo_local}
      POSTGRES_DB: ${POSTGRES_DB:-reelindo}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reelindo} -d ${POSTGRES_DB:-reelindo}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: reelindo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  media-storage:
    image: chrislusf/seaweedfs:latest
    container_name: reelindo-media-storage
    restart: unless-stopped
    command: ["server", "-s3", "-s3.iam=false", "-dir=/data", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "9000:8333"
    volumes:
      - media_data:/data
      - ./docker/seaweed-s3.json:/etc/seaweedfs/s3.json:ro
  video-worker:
    container_name: reelindo-video-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/workers/video-worker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reelindo}:${POSTGRES_PASSWORD:-reelindo_local}@postgres:5432/${POSTGRES_DB:-reelindo}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://media-storage:8333
      S3_REGION: us-east-1
      S3_BUCKET: reelindo
      S3_ACCESS_KEY_ID: reelindo-local
      S3_SECRET_ACCESS_KEY: reelindo-local-password
      S3_PUBLIC_BASE_URL: http://${LAN_HOST:-192.168.31.134}:9000/reelindo
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-storage:
        condition: service_started
    healthcheck:
      disable: true
volumes:
  postgres_data:
  redis_data:
  media_data:
